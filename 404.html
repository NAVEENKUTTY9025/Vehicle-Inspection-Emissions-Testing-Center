<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 Not Found | Apex Inspect</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta name="description" content="404 Page Not Found - Apex Inspect">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --accent: #16A34A;
      --accent-hover: #15803d;
    }
    
    body.dark {
      --bg-primary: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #22C55E;
      --accent-hover: #16A34A;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* STRICT NO-SCROLL RULE */
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      width: 100%;
      flex-shrink: 0; /* Prevent shrinking */
    }
    
    /* Matched exactly with index.html */
    .nav-logo-text {
      font-size: 1.8rem !important;
      font-weight: 700 !important;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.5px;
      display: inline-block;
      line-height: 1;
    }
    .nav-logo-text span {
      color: var(--accent);
      font-style: italic;
      font-family: 'Merriweather', serif;
    }
    
    .theme-toggle {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.2rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    
    .theme-toggle:hover {
      background: rgba(150, 150, 150, 0.1);
    }
    
    /* 404 Container */
    .not-found-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, #34d399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    
    .error-icon {
      font-size: 3.5rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }
    
    .error-title {
      font-family: 'Merriweather', serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    
    .error-desc {
      color: var(--text-secondary);
      max-width: 450px;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 2rem;
      background-color: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 50px;
      transition: background-color 0.3s, transform 0.2s;
    }
    
    .btn-home:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    
    /* Responsive styling to ensure no scrolling */
    @media (max-width: 768px) {
      .error-code { font-size: 6rem; }
      .error-title { font-size: 2rem; }
      .error-desc { font-size: 1rem; padding: 0 1rem; }
      .top-bar { padding: 1rem; }
    }
    
    @media (max-height: 600px) {
      .error-code { font-size: 5rem; }
      .error-icon { display: none; }
      .error-title { font-size: 1.5rem; margin-bottom: 0.5rem; }
      .error-desc { font-size: 0.95rem; margin-bottom: 1.5rem; }
      .btn-home { padding: 0.7rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <a href="index.html" class="nav-logo-text"><span>Apex Inspect</span></a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <!-- Main Content -->
  <div class="not-found-container">
    <i class="fas fa-exclamation-triangle error-icon"></i>
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Dead End</h2>
    <p class="error-desc">The page you're looking for has been moved, removed, or might never have existed. Let's get you back on the road.</p>
    <a href="index.html" class="btn-home">
      <i class="fas fa-home"></i> Back to Homepage
    </a>
  </div>

  <script>
    // Theme toggle functionality (matching the rest of the site)
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    
    function updateThemeIcon(isDark) {
      if (themeToggle) {
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }
    }

    // Check localStorage & system preferences
    let savedTheme = null;
    try {
      savedTheme = localStorage.getItem('theme');
    } catch (e) {
      console.warn('LocalStorage access restricted');
    }

    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark');
      updateThemeIcon(true);
    } else {
      updateThemeIcon(false);
    }

    // Toggle logic
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        const isDark = body.classList.contains('dark');
        try {
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        } catch (e) {}
        updateThemeIcon(isDark);
      });
    }
  </script>
</body>
</html>
